name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci
      - name: Build Sites
        run: node scripts/build-sites.mjs
      - name: Verify repository
        run: node --test quiz/test_quiz.mjs quiz/test_backup.mjs quiz/fuzz-properties.test.mjs scripts/test-sites.mjs scripts/test-public-ux.mjs
