name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci
      - name: Build Sites
        run: node scripts/build-sites.mjs
      - name: Verify repository
        run: node --test quiz/test_quiz.mjs quiz/test_backup.mjs quiz/fuzz-properties.test.mjs scripts/test-sites.mjs scripts/test-public-ux.mjs
